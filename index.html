<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadon Jones - Home</title>
    <script>
        (function () {
            if (window.location.search.indexOf('stay') !== -1) return;
            var ref = (document.referrer || '').toLowerCase();
            if (!ref) return;
            var professional = ['linkedin.com', 'github.com'];
            var personal = ['discord.com', 'discordapp.com', 'youtube.com', 'youtu.be'];
            function matches(hosts) { return hosts.some(function (h) { return ref.indexOf(h) !== -1; }); }
            if (matches(professional)) window.location.replace('professional.html');
            else if (matches(personal)) window.location.replace('personal.html');
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #008080;
            background-image:
                repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 8px);
            font-family: 'VT323', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .window {
            width: 100%;
            max-width: 640px;
            background: #c0c0c0;
            border: 2px solid #fff;
            border-right-color: #000;
            border-bottom-color: #000;
            box-shadow: 3px 3px 0 #000;
        }
        .titlebar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7rem;
            padding: 6px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .titlebar .btns span {
            display: inline-block; width: 16px; height: 14px;
            background: #c0c0c0; border: 1px solid #000;
            box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #fff;
            text-align: center; line-height: 14px; margin-left: 3px; color: #000; font-size: 0.65rem;
        }
        .content { padding: 24px 28px 30px; }

        @media (max-width: 480px) {
            .content { padding: 18px 16px 24px; }
            h1 { font-size: 1rem; }
            .subtitle { font-size: 1.2rem; }
            .choice { width: 100%; }
            .titlebar span:first-child { max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        }
        .marquee-bar {
            background: #000; color: #0f0; font-family: 'VT323', monospace;
            font-size: 1.1rem; padding: 4px 8px; overflow: hidden; white-space: nowrap;
            border: 2px inset #808080; margin-bottom: 20px;
        }
        .marquee-bar span { display: inline-block; padding-left: 100%; animation: scroll-left 14s linear infinite; }
        @keyframes scroll-left { from { transform: translateX(0); } to { transform: translateX(-100%); } }

        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.3rem;
            text-align: center;
            color: #000080;
            text-shadow: 2px 2px 0 #c0c0c0, 3px 3px 0 rgba(0,0,0,0.3);
            margin-bottom: 6px;
        }
        .subtitle { text-align: center; font-size: 1.4rem; color: #333; margin-bottom: 24px; }
        hr.rainbow {
            border: none; height: 4px; margin: 18px 0;
            background: repeating-linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet, red 200px);
        }

        .choices { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .choice {
            width: 240px;
            background: #dcdcdc;
            border: 2px solid #fff;
            border-right-color: #404040;
            border-bottom-color: #404040;
            box-shadow: inset -1px -1px 0 #000, inset 1px 1px 0 #fff;
            text-decoration: none;
            color: #000;
            padding: 18px 14px;
            text-align: center;
            transition: transform 0.05s;
        }
        .choice:active { border: 2px solid #404040; border-right-color: #fff; border-bottom-color: #fff; }
        .choice .icon { font-size: 2.4rem; margin-bottom: 10px; }
        .choice h2 { font-size: 1.15rem; font-family: 'Press Start 2P', monospace; margin-bottom: 10px; color: #000080; line-height: 1.4; }
        .choice p { font-size: 1.15rem; color: #333; }

        footer { text-align: center; margin-top: 24px; font-size: 1.1rem; color: #333; }
        .badge-row { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
        .badge {
            background: #000; color: #0f0; font-size: 0.9rem; padding: 3px 8px;
            border: 1px solid #0f0; font-family: 'VT323', monospace;
        }
        .visitor {
            display: inline-block; background: #000; color: #ff0; font-family: 'VT323', monospace;
            font-size: 1.3rem; padding: 2px 10px; border: 2px inset #808080; letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="window">
        <div class="titlebar">
            <span class="btns"><span>_</span><span>□</span><span>X</span></span>
        </div>
        <div class="content">
            <div class="marquee-bar"><span>*** WELCOME TO MY HOMEPAGE *** THANKS FOR STOPPING BY *** </span></div>

            <h1>WELCOME</h1>
            <p class="subtitle">Where did you come from?</p>

            <div class="choices">
                <a class="choice" href="professional.html">
                    <div class="icon">💼</div>
                    <h2>RESUME /<br>LINKEDIN</h2>
                </a>
                <a class="choice" href="personal.html">
                    <div class="icon">👾</div>
                    <h2>DISCORD /<br> ANYWHERE ELSE</h2>
                </a>
            </div>

            <hr class="rainbow">

            <footer>
                <div class="badge-row">
                    <span class="badge">Made with HTML</span>
                    <span class="badge">No cookies!</span>
                </div>
            </footer>
        </div>
    </div>
</body>
</html>
